        // 브라우저(기기)에 설정된 언어 중 지원하는 첫 번째 언어 사용, 없으면 영어. 주소 뒤에 ?lang=en 처럼 붙여 강제 지정 가능
        const LANG = [new URLSearchParams(location.search).get('lang'), ...(navigator.languages || [navigator.language])]
            .filter(Boolean)
            .map(l => l.toLowerCase().split('-')[0])
            .find(l => I18N[l]) || 'en';
        const T = I18N[LANG];
        const IS_KO = LANG === 'ko';

        // ---------- 검색 대상 목록 ----------

        // 검색용 문자열 정리 (소문자, 공백/밑줄/슬래시/마침표 제거)
        const normalize = (s) => s.toLowerCase().replace(/[\s_\/.]/g, '');
        const titleCase = (s) => s.replace(/(^|\s)([a-z])/g, (m, space, ch) => space + ch.toUpperCase());

        let regionNames = null;
        try { if (!IS_KO) regionNames = new Intl.DisplayNames([LANG], { type: 'region' }); } catch (error) {}

        // 한국어: "대한민국 부산" / 그 외 언어: "Busan, South Korea"
        function makeLabel(country, city, enCity) {
            if (IS_KO) return country === city ? city : `${country} ${city}`;
            const code = COUNTRY_CODES[country];
            const countryName = code && regionNames ? regionNames.of(code) : '';
            return countryName ? `${enCity}, ${countryName}` : enCity;
        }

        // 전체 검색 대상 목록 만들기: 주요 도시 + 추가 도시 + 브라우저가 지원하는 나머지 전 세계 타임존
        const ZONES = MAJOR_CITIES.map(([country, city, tz, extra]) => ({
            tz,
            label: makeLabel(country, city, EN_CITY_OVERRIDES[tz] || tz.split('/').pop().replace(/_/g, ' ')),
            search: normalize(`${country}${city}${tz}${extra}`)
        }));
        MORE_CITIES.forEach(([country, countryExtra, tz, cities]) => {
            cities.split(',').forEach(entry => {
                // '도시:영문 이름|추가 검색어' 형식
                const [city, rest = ''] = entry.trim().split(':');
                const enCity = titleCase(rest.split('|')[0].split(' ').filter(w => /^[\x00-\x7F]+$/.test(w)).join(' '));
                ZONES.push({
                    tz,
                    label: makeLabel(country, city, enCity),
                    search: normalize(`${country}${city}${countryExtra}${rest}`)
                });
            });
        });
        if (Intl.supportedValuesOf) {
            const known = new Set(ZONES.map(z => z.tz));

            ['Asia/Calcutta', 'Asia/Saigon', 'Asia/Katmandu', 'Asia/Rangoon', 'Europe/Kiev', 'America/Buenos_Aires'].forEach(tz => known.add(tz));
            Intl.supportedValuesOf('timeZone').forEach(tz => {
                if (known.has(tz)) return;
                ZONES.push({
                    tz,
                    label: tz.split('/').slice(1).join(' / ').replace(/_/g, ' ') || tz,
                    search: normalize(tz)
                });
            });
        }
        const findZone = (tz) => ZONES.find(z => z.tz === tz);

        // DOM 요소 가져오기
        const localPlaceEl = document.getElementById('local-place');

        document.documentElement.lang = LANG;

        const localTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        let results = [];

        // 글자가 한 줄에 다 들어가도록 폰트 크기를 자동으로 줄이기
        const ONE_LINE_ELS = [localPlaceEl, localPlaceSubEl, localDstEl, targetPlaceEl, targetPlaceSubEl, targetDstEl];
        function fitOneLine(el) {
            el.style.fontSize = '';
            let size = parseFloat(getComputedStyle(el).fontSize);
            while (el.scrollWidth > el.clientWidth && size > 9) {
                size -= 1;
                el.style.fontSize = size + 'px';
            }
        }
        const fitAll = () => ONE_LINE_ELS.forEach(fitOneLine);
        window.addEventListener('resize', fitAll);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

        // 타임존의 UTC 기준 차이 (예: GMT+9)
        function getOffsetLabel(timezone) {
            try {
                const parts = new Intl.DateTimeFormat('en-US', { timeZone: timezone, timeZoneName: 'shortOffset' }).formatToParts(new Date());
                return parts.find(p => p.type === 'timeZoneName').value;
            } catch (error) {
                return '';
            }
        }

        // 특정 시점에 타임존이 UTC보다 몇 분 빠른지 계산
        function getOffsetMinutes(timezone, date) {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone, hourCycle: 'h23',
                year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric'
            }).formatToParts(date);
            const v = {};
            parts.forEach(p => { v[p.type] = Number(p.value); });
            return Math.round((Date.UTC(v.year, v.month - 1, v.day, v.hour, v.minute, v.second) - date.getTime()) / 60000);
        }

        // 서머타임 상태 문구: 1월과 7월의 시차가 같으면 서머타임이 없는 지역, 다르면 시계가 더 빠른 쪽이 서머타임 기간
        function getDstText(timezone) {
            try {
                const now = new Date();
                const year = now.getUTCFullYear();
                const january = getOffsetMinutes(timezone, new Date(Date.UTC(year, 0, 1)));
                const july = getOffsetMinutes(timezone, new Date(Date.UTC(year, 6, 1)));
                if (january === july) return T.dstNone;
                return getOffsetMinutes(timezone, now) === Math.max(january, july) ? T.dstOn : T.dstOff;
            } catch (error) {
                return '';
            }
        }

        function updateZoneInfo() {
            localPlaceSubEl.textContent = `${localTimezone} · ${getOffsetLabel(localTimezone)}${localNote ? ' · ' + localNote : ''}`;
            localDstEl.textContent = getDstText(localTimezone);
            targetPlaceSubEl.textContent = `${selectedZone.tz} · ${getOffsetLabel(selectedZone.tz)}`;
            targetDstEl.textContent = getDstText(selectedZone.tz);
            fitAll();
        }

        // ---------- 대상 도시 검색 ----------

        function selectZone(zone) {
            selectedZone = zone;
            tzInput.value = zone.label;
            targetPlaceEl.textContent = zone.label;
            closeList();
            updateZoneInfo();
            updateTime(); // 즉시 업데이트
        }

        function renderList() {
            const query = normalize(tzInput.value);
            const matched = query ? ZONES.filter(z => z.search.includes(query) || normalize(z.label).includes(query)) : ZONES;
            results = matched.slice(0, 100);
            activeIndex = 0;
            tzList.innerHTML = '';

            if (results.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'p-3 font-bold text-gray-500';
                empty.textContent = T.noResult;
                tzList.appendChild(empty);
            }

            results.forEach((zone, index) => {
                const item = document.createElement('div');
                item.className = 'tz-item p-3 cursor-pointer flex justify-between items-center gap-3' + (index === 0 ? ' active' : '');
                const name = document.createElement('span');
                name.className = 'font-bold';
                name.textContent = zone.label;
                const sub = document.createElement('span');
                sub.className = 'text-sm whitespace-nowrap';
                sub.textContent = getOffsetLabel(zone.tz);
                item.append(name, sub);
                // 입력창의 blur보다 먼저 처리되도록 mousedown 사용
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    selectZone(zone);
                    tzInput.blur();
                });
                item.addEventListener('mousemove', () => setActive(index));
                tzList.appendChild(item);
            });
            tzList.classList.remove('hidden');
        }

        function setActive(index) {
            const items = tzList.querySelectorAll('.tz-item');
            if (!items.length) return;
            items[activeIndex]?.classList.remove('active');
            activeIndex = (index + items.length) % items.length;
            items[activeIndex].classList.add('active');
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }

        function closeList() {
            tzList.classList.add('hidden');
        }

        tzInput.addEventListener('focus', () => {
            tzInput.value = ''; // 새로 검색할 수 있도록 비우고 전체 목록 표시
            renderList();
        });
        tzInput.addEventListener('input', renderList);
        tzInput.addEventListener('blur', () => {
            tzInput.value = selectedZone.label; // 선택하지 않고 나가면 원래 도시로 복원
            closeList();
        });
        tzInput.addEventListener('keydown', (e) => {
            if (e.isComposing) return; // 한글 조합 중 Enter 무시
            if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
            else if (e.key === 'Enter') {
                if (results[activeIndex]) { selectZone(results[activeIndex]); tzInput.blur(); }
            }
            else if (e.key === 'Escape') { tzInput.blur(); }
        });

        // ---------- 내 위치 표시 ----------

        function showLocalPlace(text, note) {
            localPlaceEl.textContent = `📍 ${text}`;
            localNote = note || '';
            updateZoneInfo();
        }

        // 위치 권한이 없을 때: 기기 시간대 기준으로 대략적인 위치 표시
        function showTimezonePlace(note) {
            const zone = findZone(localTimezone);
            showLocalPlace(zone ? zone.label : localTimezone, note);
        }

        // GPS/와이파이 기반 실제 위치를 주소로 변환해 표시
        function locateMe() {
            if (!navigator.geolocation) {
                showTimezonePlace(T.byTz);
                return;
            }
            locateBtn.classList.add('hidden');
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=${LANG}`);
                    const data = await res.json();
                    // 국가 > 시/도 > 시 > 구/동 순으로, 중복 없이 이어 붙이기
                    const names = [];
                    [data.countryName, data.principalSubdivision, data.city, data.locality].forEach(name => {
                        if (name && !names.includes(name)) names.push(name);
                    });
                    if (!names.length) throw new Error('no address');
                    // 한국어/일본어/중국어는 큰 단위부터, 그 외 언어는 작은 단위부터 쓰는 것이 자연스러움
                    const bigFirst = ['ko', 'ja', 'zh'].includes(LANG);
                    showLocalPlace(bigFirst ? names.join(' ') : names.reverse().join(', '));
                } catch (error) {
                    showTimezonePlace(T.byTz);
                    locateBtn.classList.remove('hidden');
                }
            }, () => {
                showTimezonePlace(T.noPerm);
                locateBtn.classList.remove('hidden');
            }, { timeout: 10000, maximumAge: 600000 });
        }

        locateBtn.addEventListener('click', locateMe);

        // 체크박스 이벤트 처리
        formatToggle.addEventListener('change', (e) => {
            is24HourFormat = e.target.checked;
            updateTime(); // 즉시 업데이트
        });

        // 날짜와 시간을 포맷팅하는 함수
        function formatDateTime(date, timezone) {
            try {
                // Intl.DateTimeFormat을 사용하여 타임존에 맞는 시간 추출
                const options = {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    // h23: 자정이 24:00이 아닌 00:00으로 표시되도록
                    hourCycle: is24HourFormat ? 'h23' : 'h12'
                };

                const parts = new Intl.DateTimeFormat('en-US', options).formatToParts(date);

                let year, month, day, hour, minute, second, dayPeriod;

                parts.forEach(part => {
                    if (part.type === 'year') year = part.value;
                    if (part.type === 'month') month = part.value;
                    if (part.type === 'day') day = part.value;
                    if (part.type === 'hour') hour = part.value;
                    if (part.type === 'minute') minute = part.value;
                    if (part.type === 'second') second = part.value;
                    if (part.type === 'dayPeriod') dayPeriod = part.value;
                });

                const dateString = `${year}-${month}-${day}`;
                let timeString = `${hour}:${minute}:${second}`;

                // 12시간제일 경우 AM/PM 추가
                if (!is24HourFormat && dayPeriod) {
                    timeString = `${timeString} ${dayPeriod}`;
                }

                return { dateString, timeString };
            } catch (error) {
                // 유효하지 않은 타임존일 때의 예외 처리
                return { dateString: '----------', timeString: '--:--:--' };
            }
        }

        // 화면 업데이트 함수
        function updateTime() {
            const now = new Date();

            // 1. 내 위치 시간 계산 (브라우저 기본 타임존)
            const localData = formatDateTime(now, localTimezone);
            localDateEl.textContent = localData.dateString;
            localTimeEl.textContent = localData.timeString;

            // 2. 선택한 국가 시간 계산
            const targetData = formatDateTime(now, selectedZone.tz);
            targetDateEl.textContent = targetData.dateString;
            targetTimeEl.textContent = targetData.timeString;
        }

        // 초기 실행 및 1초마다 업데이트
        selectZone(selectedZone);
        showLocalPlace(T.locating);
        showTimezonePlace(); // 우선 시간대 기준으로 표시하고
        locateMe();          // 권한이 허용되면 정확한 위치로 교체
        setInterval(updateTime, 1000);
        setInterval(updateZoneInfo, 60000);
    </script>
</body>
</html>
